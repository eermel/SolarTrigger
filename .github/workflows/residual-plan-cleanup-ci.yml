name: residual-plan-cleanup-ci

on:
  push:
    branches:
      - refactor/remove-execution-plan-legacy-20260923

permissions:
  contents: write

jobs:
  cleanup-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-execution-plan-legacy-20260923
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply residual cleanup
        run: |
          python - <<'PY'
          from tools.cleanup_residual_execution_plan_legacy import (
              clean_backend,
              clean_docs,
              clean_install,
              clean_tests,
          )
          clean_backend()
          clean_docs()
          clean_install()
          clean_tests()
          print("residual execution-plan cleanup applied")
          PY
      - name: Global legacy audit
        shell: bash
        run: |
          set -euo pipefail
          core='ExecutionPlanRuntime|execution_plan_runtime|execution_plan_text|sequencer_compiler|sequencer_plan_service|anchor_sequencer|/api/sequencer/|generated/execution_plan|execution_plan_file|config_type.{0,8}execution_plan|validation\.plan|Execution Plan'
          if git grep -n -E "$core" -- . ':!.github/workflows/residual-plan-cleanup-ci.yml' ':!tools/cleanup_residual_execution_plan_legacy.py' > /tmp/core-hits; then
            echo 'Residual execution-plan architecture found:'
            cat /tmp/core-hits
            exit 1
          fi
          git grep -n -F '.plan' -- . ':!.github/workflows/residual-plan-cleanup-ci.yml' ':!tools/cleanup_residual_execution_plan_legacy.py' > /tmp/dot-plan-all || true
          grep -Ev '(planner\.plan\(|exposure_planner\.plan\(|sony_backend\.plan\(|sony_compat\.plan\(|args\.plan|\.plan\(|\.planned|\.plan_cache|backend\.plan_cache)' /tmp/dot-plan-all > /tmp/dot-plan-hits || true
          if [ -s /tmp/dot-plan-hits ]; then
            echo 'Residual .plan file/document references found:'
            cat /tmp/dot-plan-hits
            exit 1
          fi
          echo 'No residual execution-plan architecture found.'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev libgphoto2-6 gphoto2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask flask-socketio simple-websocket gphoto2 pygame pyserial gunicorn pytz timezonefinder
      - name: Syntax checks
        run: |
          python -m py_compile backend/camera_validation.py backend/camera_validation_scheduler.py backend/runtime_paths.py backend/state_store.py flask_app/app.py scripts/eclipse_trigger.py
          bash -n install/install_solareclipse.sh
          bash -n install/install_standalone_runtime_service.sh
          sh -n install/solartrigger-release-update
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit cleaned tree
        run: |
          if git diff --quiet -- . ':!.github/workflows/residual-plan-cleanup-ci.yml' ':!tools/cleanup_residual_execution_plan_legacy.py'; then
            echo 'No generated cleanup changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove residual execution-plan legacy"
          git push origin HEAD:refactor/remove-execution-plan-legacy-20260923
