name: remove-execution-plan-legacy-ci

on:
  push:
    branches:
      - refactor/remove-execution-plan-legacy-20260923

permissions:
  contents: write

jobs:
  refactor-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-execution-plan-legacy-20260923
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic refactor
        run: python tools/refactor_remove_execution_plan_legacy.py
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev libgphoto2-6 gphoto2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask flask-socketio simple-websocket gphoto2 pygame pyserial gunicorn pytz timezonefinder
      - name: Syntax checks
        run: |
          python -m py_compile backend/camera_validation.py backend/camera_validation_scheduler.py flask_app/app.py
          bash -n install/install_solareclipse.sh
          bash -n install/install_standalone_runtime_service.sh
          sh -n install/solartrigger-release-update
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit refactor output
        run: |
          if git diff --quiet -- . ':!.github/workflows/remove-execution-plan-legacy-ci.yml' ':!tools/refactor_remove_execution_plan_legacy.py'; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy execution-plan architecture"
          git push origin HEAD:refactor/remove-execution-plan-legacy-20260923
