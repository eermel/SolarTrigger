name: remaining-trigger-hardening-ci

on:
  push:
    branches:
      - refactor/remove-execution-plan-legacy-20260923

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-execution-plan-legacy-20260923
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply remaining hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/apply_remaining_trigger_hardening.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '        """Resume one same-boot persisted run without replaying past phases."""',
              '        # Resume one same-boot persisted run without replaying past phases.',
          )
          text = text.replace(
              '        """Recover at most once, and only inside the same Linux boot."""',
              '        # Recover at most once, and only inside the same Linux boot.',
          )
          text = text.replace('PHASE_NAMES', 'PHASE_LABELS')

          text, count = re.subn(
              r'    old = "nextState\.running = nextPhase !== \\"idle\\";".*?    text = text\.replace\(old, new, 1\)\n',
              "    old = \"running: nextPhase !== 'idle',\"\n"
              "    if old not in text:\n"
              "        raise RuntimeError(\"trigger_phase running field not found\")\n"
              "    new = (\"running: typeof d.running === 'boolean' \"\n"
              "           \"? d.running : !['idle', 'failed'].includes(nextPhase),\")\n"
              "    text = text.replace(old, new, 1)\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('unable to adapt frontend running-state transform')

          path.write_text(text, encoding='utf-8')
          PY

          python tools/apply_remaining_trigger_hardening.py

      - name: Reconcile with current runtime contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/trigger_service.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'strict_circumstances_date=not (simulate or dry_run or _recovery),',
              'strict_circumstances_date=not (simulate or dry_run),',
          )

          text = text.replace(
              '{"rig_id": rig_id, "phase": published_phase, "running": True},',
              '{"rig_id": rig_id, "phase": published_phase},',
          )
          text = text.replace(
              '{"rig_id": rig_id, "phase": "recovering", "running": True},',
              '{"rig_id": rig_id, "phase": "recovering"},',
          )
          text = text.replace(
              '{"rig_id": rig_id, "phase": "idle", "running": False},',
              '{"rig_id": rig_id, "phase": "idle"},',
          )

          start = text.find("                owns_process = (\n")
          end = text.find(
              "\n                if owns_process and not process_still_alive:",
              start,
          )
          if start < 0 or end < 0:
              raise SystemExit('generated owns_process block not found')
          new = """                owns_process = (
                      self._procs[rig_id] is proc
                      or (
                          proc is not None
                          and self._procs[rig_id] is None
                          and self._cancel_start_requested_by_rig[rig_id]
                      )
                      or (
                          proc is None
                          and self._starting_by_rig[rig_id]
                      )
                  )"""
          text = text[:start] + new + text[end:]

          marker = "        recovery_selection = None\n"
          init = (
              "        recovery_selection = None\n"
              "        if not hasattr(self, 'run_journal'):\n"
              "            self.run_journal = None\n"
              "        if not hasattr(self, 'heartbeat_timeout_s'):\n"
              "            self.heartbeat_timeout_s = DEFAULT_HEARTBEAT_TIMEOUT_S\n"
              "        if not hasattr(self, '_run_ids_by_rig'):\n"
              "            self._run_ids_by_rig = {item: None for item in range(1, 5)}\n"
              "        if not hasattr(self, '_stopping_by_rig'):\n"
              "            self._stopping_by_rig = {item: False for item in range(1, 5)}\n"
          )
          if marker not in text:
              raise SystemExit('generated _run locals marker not found')
          text = text.replace(marker, init, 1)

          path.write_text(text, encoding='utf-8')

          path = Path('flask_app/static/js/solartrigger.js')
          text = path.read_text(encoding='utf-8')

          transformed = (
              "running: typeof d.running === 'boolean' "
              "? d.running : !['idle', 'failed'].includes(nextPhase),"
          )
          legacy = "running: nextPhase !== 'idle',"
          if transformed not in text:
              raise SystemExit('generated trigger running assignment not found')
          text = text.replace(transformed, legacy, 1)

          handler = "socket.on('trigger_phase', d => {"
          pos = text.find(handler)
          if pos < 0:
              raise SystemExit('trigger_phase handler not found')

          helper = """function triggerPhaseRunningState(d, nextPhase) {
            if (typeof d.running === 'boolean') return d.running;
            return nextPhase !== 'idle' && nextPhase !== 'failed';
          }

          """
          if 'function triggerPhaseRunningState(' not in text:
              text = text[:pos] + helper + text[pos:]

          running_pos = text.find(legacy, pos)
          object_end = text.find("\n  };", running_pos)
          if running_pos < 0 or object_end < 0:
              raise SystemExit('trigger_phase state assignment not found')
          object_end += len("\n  };")
          refinement = (
              "\n  state.triggerRigs[key].running = "
              "triggerPhaseRunningState(d, nextPhase);"
          )
          text = text[:object_end] + refinement + text[object_end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Diff and syntax checks
        run: |
          git diff --check
          python -m py_compile \
            backend/trigger_service.py \
            backend/runtime_daemon.py \
            backend/trigger_run_journal.py \
            backend/trigger_heartbeat.py \
            scripts/eclipse_trigger.py
          bash -n install/install_standalone_runtime_service.sh

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev libgphoto2-6 gphoto2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask flask-socketio simple-websocket gphoto2 pygame pyserial gunicorn pytz timezonefinder

      - name: Targeted hardening tests
        run: |
          python -m pytest -q \
            tests/test_trigger_run_journal.py \
            tests/test_trigger_heartbeat.py \
            tests/test_remaining_trigger_hardening.py \
            tests/test_runtime_trigger_recovery.py \
            tests/test_trigger_service_ipc_lifecycle_endstates.py \
            tests/test_frontend_trigger_ui.py \
            tests/test_remaining_robustness_20260916.py \
            tests/test_emergency_totality_start_rollback_20260915.py \
            tests/test_trigger_circumstances_date.py \
            tests/test_trigger_frontend_idle_state.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Commit validated product changes
        run: |
          if git diff --quiet -- \
              backend/trigger_service.py \
              backend/runtime_daemon.py \
              scripts/eclipse_trigger.py \
              flask_app/static/js/solartrigger.js \
              install/install_standalone_runtime_service.sh; then
            echo 'No generated product changes to commit'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            backend/trigger_service.py \
            backend/runtime_daemon.py \
            scripts/eclipse_trigger.py \
            flask_app/static/js/solartrigger.js \
            install/install_standalone_runtime_service.sh

          git commit -m "Complete trigger runtime hardening"
          git push origin HEAD:refactor/remove-execution-plan-legacy-20260923
