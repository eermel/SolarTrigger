name: journal-hardening-ci

on:
  push:
    branches:
      - hardening/journal-durability-failed-state-20260923

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev libgphoto2-6 gphoto2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask flask-socketio simple-websocket gphoto2 pygame pyserial gunicorn pytz timezonefinder
      - name: Syntax checks
        run: |
          git diff --check origin/main...HEAD
          python -m py_compile \
            backend/trigger_run_journal.py \
            backend/runtime_daemon.py \
            backend/trigger_service.py
      - name: Targeted journal hardening tests
        run: |
          python -m pytest -q \
            tests/test_trigger_run_journal.py \
            tests/test_runtime_trigger_recovery.py \
            tests/test_remaining_trigger_hardening.py
      - name: Full test suite
        run: python -m pytest -q
