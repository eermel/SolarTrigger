name: standalone-runtime-ci

on:
  push:
    branches:
      - hardening/standalone-runtime-20260922
      - feature/update-installer-devices-ui
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev libgphoto2-6 gphoto2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask flask-socketio simple-websocket gphoto2 pygame pyserial gunicorn pytz timezonefinder
      - name: Syntax checks
        run: |
          python -m py_compile backend/runtime_rpc.py backend/runtime_daemon.py backend/system_maintenance.py backend/system_maintenance_routes.py flask_app/app.py scripts/build_release_package.py
          bash -n install/install_solareclipse.sh
          bash -n install/install_standalone_runtime_service.sh
          sh -n install/solartrigger-release-update
      - name: Full test suite
        run: python -m pytest -q
