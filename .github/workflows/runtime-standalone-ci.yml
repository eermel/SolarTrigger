name: standalone-runtime-ci

on:
  push:
    branches:
      - main
      - hardening/standalone-runtime-20260922
      - refactor/indi-astro-device-manager
      - hardening/backend-authoritative-control
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev libgphoto2-6 gphoto2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyflakes Flask flask-socketio simple-websocket gphoto2 pygame pyserial gunicorn pytz timezonefinder
      - name: Static Python checks
        run: |
          python -m compileall -q backend scripts services plugins flask_app
          python -m pyflakes backend scripts services plugins flask_app > /tmp/pyflakes.txt || true
          cat /tmp/pyflakes.txt
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "Undefined Python name detected by pyflakes."
            exit 1
          fi
      - name: Shell syntax checks
        run: |
          bash -n install/install_solareclipse.sh
          bash -n install/install_standalone_runtime_service.sh
          sh -n install/solartrigger-release-update
      - name: Full test suite
        run: python -m pytest -q
